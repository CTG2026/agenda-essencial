<script>

function $(s){return document.querySelector(s)}

function baseHours(d){var f=iso(d);return (dias[f]?dias[f].horas:cfg["d"+wd(d)]||[]).slice()}

function parseTr(t){var G=[],g=null;t.split("\n").forEach(function(l){l=l.trim();if(!l)return;if(l[0]=="#"){g={g:l.replace(/^#\s*/,"").toUpperCase(),i:[]};G.push(g)}else{if(!g){g={g:"OTROS",i:[]};G.push(g)}var p=l.split("|"),n=function(x){return Number((x||"").replace(/\D/g,""))||0};g.i.push({n:p[0].trim(),p:n(p[1]),c:n(p[2])})}});return G}

function selData(s){var o=s.selectedOptions[0];return{p:Number(o&&o.dataset.p)||0,c:Number(o&&o.dataset.c)||0}}

function render(){

    out='<div class="grid">';for(var i=0;i<6;i++)out+=dayHtml(add(m,i));out+='</div>'}

function shrink(file){return new Promise(function(ok,no){var im=new Image();im.onload=function(){var s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);var q=.7,u=c.toDataURL("image/jpeg",q);while(u.length>190000&&q>.3){q-=.1;u=c.toDataURL("image/jpeg",q)}u.length>190000?no():ok(u)};im.onerror=no;im.src=URL.createObjectURL(file)})}

  onSnapshot:function(cb){var load=async function(){var q=await sb.from(r.t).select("data").eq("id",r.id).maybeSingle();cb({exists:!!q.data,data:function(){return q.data&&q.data.data}})};load();sub(r.t,load)}}},
 collection:function(p){var t=p.split("/")[0]=="data"?"comisiones":p.split("/")[0];return{
  onSnapshot:function(cb,er){var load=async function(){var q=await sb.from(t).select("id,data");if(q.error){er&&er(q.error);return}cb(snapC(q.data))};load();sub(t,load)},
  where:function(f,op,v){return{get:async function(){var q=await sb.from(t).select("id,data").eq("data->>"+f,v);return snapC(q.data)}}}}}}}
function start(u){
  uid=u.id;$("#lo").classList.remove("show");db=makeDb();if(!quien)pickWho();
  db.collection("citas").onSnapshot(function(s){citas={};s.docs.forEach(function(x){citas[x.id]=Object.assign({id:x.id},x.data())});$("#dot").className="dot on";$("#st").textContent="En vivo";render()},function(){$("#st").textContent="Error de conexión"});
  db.collection("clientes").onSnapshot(function(s){clientes={};s.docs.forEach(function(x){clientes[x.id]=x.data()});render()});
  db.collection("dias").onSnapshot(function(s){dias={};s.docs.forEach(function(x){dias[x.id]=x.data()});render()});
  db.doc("config/tratamientos").onSnapshot(function(s){var x=s.exists?s.data():{};trTxt=x.texto||TX0;msgT=x.msg||MSG0;render()});
  db.doc("config/horarios").onSnapshot(function(s){if(s.exists){var x=s.data();for(var i=0;i<6;i++){if(x["d"+i])cfg["d"+i]=x["d"+i]}if(x.col!=null)cfg.col=x.col;if(x.dE)cfg.dE=x.dE;if(x.dT)cfg.dT=x.dT}render()});
}
async function gate(u){var q=await sb.from("perfiles").select("nombre").eq("id",u.id).maybeSingle();
  if(!q.data){await sb.auth.signOut();$("#lo").classList.add("show");$("#lm").textContent="Tu usuario no tiene permiso. Pide acceso a la administradora.";return}start(u)}

  var q=await sb.auth.signInWithPassword({email:$("#le").value.trim(),password:$("#lp").value});
  if(q.error){$("#lm").textContent="Correo o contraseña incorrectos";return}gate(q.data.user)};

else $("#lm").textContent="Falta configurar Supabase en index.html";
